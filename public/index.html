<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ (WASM) API Explorer</title>
  <style>
    /* 全局重置与字体 */
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      /* 背景动效：淡淡的渐变光晕 */
      background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeInDown 0.6s ease-out;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #818cf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* API 卡片：毛玻璃效果 */
    .api-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
      animation: fadeInUp 0.6s ease-out both;
    }

    .api-card:nth-child(2) { animation-delay: 0.1s; }
    .api-card:nth-child(3) { animation-delay: 0.2s; }

    .api-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .api-header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .method {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      margin-right: 12px;
      letter-spacing: 0.5px;
    }

    .path {
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .api-desc {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    /* 表单交互区 */
    .playground {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 150px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      height: 42px;
      align-self: flex-end;
      position: relative;
      overflow: hidden;
    }

    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.97); }
    
    button.loading {
      color: transparent;
      pointer-events: none;
    }

    button.loading::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      top: 50%;
      left: 50%;
      margin: -8px 0 0 -8px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* 结果输出框 */
    .result-box {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #a78bfa;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .result-box.error { color: #f87171; }
    .result-box.active { display: block; }

    /* 动画定义 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>C++ (WASM) API Explorer</h1>
      <p>极速、无状态的 WebAssembly 计算引擎</p>
    </header>

    <!-- 原有的接口 1 -->
    <div class="api-card">
      <div class="api-header">
        <span class="method">GET</span>
        <span class="path">/api/compute</span>
      </div>
      <div class="playground">
        <input type="text" id="input-n" value="10000000000">
        <button onclick="testCompute(this)">发送</button>
      </div>
      <div class="result-box" id="output-compute"></div>
    </div>

    <!-- 原有的接口 2 -->
    <div class="api-card">
      <div class="api-header">
        <span class="method">GET</span>
        <span class="path">/api/cipher</span>
      </div>
      <div class="playground">
        <input type="text" id="input-text" value="Hello WASM">
        <input type="number" id="input-shift" value="3">
        <button onclick="testCipher(this)">发送</button>
      </div>
      <div class="result-box" id="output-cipher"></div>
    </div>

    <!-- 新增的接口 3：WebP -->
    <div class="api-card">
      <div class="api-header">
        <span class="method">POST</span>
        <span class="path">/api/encode</span>
      </div>
      <div class="api-desc">将 RGBA 像素数据编码为 WebP（测试 libwebp）。</div>
      <div class="playground">
        <div class="input-group">
          <label>质量 (0-100)</label>
          <input type="number" id="webp-quality" value="75">
        </div>
        <button onclick="testEncodeWebP(this)">生成测试图并编码</button>
      </div>
      <div class="result-box" id="output-webp"></div>
      <!-- 用于预览生成的图片 -->
      <img id="webp-preview" style="display:none; max-width: 100%; margin-top: 15px; border-radius: 8px;" />
    </div>

    <div class="api-card">
      <div class="api-header">
        <span class="method">POST</span>
        <span class="path">/api/eval</span>
      </div>
      <div class="api-desc">在安全的 Lua 沙箱中执行代码，请将结果赋值给 result 变量。</div>
      <div class="playground">
      <textarea id="lua-code" rows="4" style="width:100%; font-family: monospace; background:#0b1120; color:#e2e8f0; border:1px solid #333; border-radius:8px; padding:10px;">
local t = { name = "Alice", score = 99 }
print(string.format('{"name":"%s","score":%d}', t.name, t.score))</textarea>
        <button onclick="testLua(this)">执行</button>
      </div>
      <div class="result-box" id="output-lua"></div>
    </div>
  </div>

  <script>
    async function makeRequest(url, btn, outElement) { /* 之前写过的通用请求函数 */ 
        btn.classList.add('loading');
        outElement.className = 'result-box active';
        outElement.textContent = '执行中...';
        try {
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Server error');
            outElement.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
            outElement.className = 'result-box active error';
            outElement.textContent = '❌ 请求失败: ' + err.message;
        } finally {
            btn.classList.remove('loading');
        }
    }

    function testCompute(btn) {
        const n = encodeURIComponent(document.getElementById('input-n').value);
        makeRequest(`/api/compute?n=${n}`, btn, document.getElementById('output-compute'));
    }

    function testCipher(btn) {
        const text = encodeURIComponent(document.getElementById('input-text').value);
        const shift = document.getElementById('input-shift').value;
        makeRequest(`/api/cipher?text=${text}&shift=${shift}`, btn, document.getElementById('output-cipher'));
    }

    async function testEncodeWebP(btn) {
      const quality = document.getElementById('webp-quality').value;
      const out = document.getElementById('output-webp');
      const imgPreview = document.getElementById('webp-preview');
      
      btn.classList.add('loading');
      out.className = 'result-box active';
      out.textContent = '生成图像并请求 WASM 编码...';
      imgPreview.style.display = 'none';

      try {
        // 1. 用 Canvas 生成一张 256x256 测试图
        const width = 256, height = 256;
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // 绘制一个渐变色块
        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, '#6366f1');
        gradient.addColorStop(1, '#34d399');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        
        // 2. 提取 RGBA 数据并转 Base64
        const imageData = ctx.getImageData(0, 0, width, height);
        // 注意：如果图片较大，直接 String.fromCharCode(...data) 会爆栈，这里用循环处理
        let binary = '';
        const bytes = new Uint8Array(imageData.data.buffer);
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        const base64 = btoa(binary);

        // 3. 发送 POST 请求
        const res = await fetch('/api/encode', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64, width, height, quality: parseFloat(quality) })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error');
        
        // 4. 显示结果
        out.textContent = `✅ 编码成功！\n原始大小: ${bytes.byteLength} 字节\nWebP 大小: ${data.size} 字节\n后端: ${data.backend}`;
        
        // 5. 预览图片
        imgPreview.src = `data:image/webp;base64,${data.webpBase64}`;
        imgPreview.style.display = 'block';

      } catch (err) {
        out.className = 'result-box active error';
        out.textContent = '❌ 编码失败: ' + err.message;
      } finally {
        btn.classList.remove('loading');
      }
    }

    async function testLua(btn) {
      const code = document.getElementById('lua-code').value;
      const out = document.getElementById('output-lua');
      btn.classList.add('loading');
      out.className = 'result-box active';
      out.textContent = '执行中...';

      try {
        const res = await fetch('/api/eval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        if (!res.ok) out.className = 'result-box active error';
      } catch (err) {
        out.className = 'result-box active error';
        out.textContent = '❌ 请求失败: ' + err.message;
      } finally {
        btn.classList.remove('loading');
      }
    }
  </script>
</body>
</html>
